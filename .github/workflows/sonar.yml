# ─────────────────────────────────────────────────────────────────────────────
# Analyse SonarQube du backend siège (workflow réutilisable, appelé par maven.yml)
#
# DÉSACTIVÉ PAR DÉFAUT : le workflow appelant ne lance ce job que si la variable de dépôt
# SONAR_ENABLED vaut 'true' (Settings > Secrets and variables > Actions > Variables).
# Sans cela il est ignoré, au lieu de rester en attente d'un runner qui n'existe pas.
#
# Même principe que le front et le backend pays : SonarQube tourne en local (localhost:9000), un runner
# self-hosted (Windows + Docker) exécute l'analyse. Pour l'activer :
#   1. docker compose --profile sonar up -d            (SonarQube, voir le README ; inutile s'il tourne déjà pour un autre projet)
#   2. enregistrer un runner self-hosted sur ce dépôt (Settings > Actions > Runners)
#   3. créer le secret SONAR_TOKEN (jeton d'analyse du projet futurekawa-backend-siege)
#   4. créer la variable SONAR_ENABLED = true
#
# L'analyse n'a besoin que de Docker sur le runner : Maven tourne dans le conteneur maven:3.9-eclipse-temurin-21.
# Les classes compilées et les rapports (tests, couverture JaCoCo) viennent du job de build via un artefact.
# sonar.qualitygate.wait=true : le job échoue si la Quality Gate échoue.
# Couverture minimale : après l'analyse, l'étape « Checking minimum coverage » lit la couverture globale dans SonarQube
# et fait échouer le job si elle est inférieure à coverage_min (80 % par défaut) ou absente.
# Les workflows appelants ne construisent et ne publient l'image Docker que si ce job réussit (ou s'il est ignoré,
# SONAR_ENABLED n'étant pas à 'true').
# ─────────────────────────────────────────────────────────────────────────────
name: SonarQube Analysis

on:
  workflow_call:
    inputs:
      artifact:
        description: "Artefact du job de build : target/classes, target/test-classes, rapports de tests et target/site/jacoco"
        required: true
        type: string
      coverage_min:
        description: "Couverture globale minimale (en %) exigée dans SonarQube pour que le job réussisse"
        required: false
        type: number
        default: 80
    secrets:
      SONAR_TOKEN:
        description: "Jeton d'analyse SonarQube"
        required: false

jobs:
  sonar:
    name: SonarQube Analysis
    runs-on: self-hosted

    steps:
      - name: Code checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Downloading build outputs and coverage report
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact }}
          path: target/

      # Le jeton passe par l'environnement (masqué dans les logs) et non par la ligne de commande.
      # host.docker.internal : depuis un conteneur Docker, désigne la machine hôte où écoute SonarQube (:9000).
      # Le volume futurekawa-maven-repo garde le cache Maven d'une analyse à l'autre (partagé avec le backend pays).
      - name: SonarQube Analysis & Quality Gate
        shell: cmd
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          docker run --rm ^
            -e SONAR_TOKEN ^
            -v "%GITHUB_WORKSPACE%:/usr/src" ^
            -v futurekawa-maven-repo:/root/.m2 ^
            -w /usr/src ^
            maven:3.9-eclipse-temurin-21 ^
            mvn -B -ntp sonar:sonar ^
              -Dsonar.host.url=http://host.docker.internal:9000 ^
              -Dsonar.qualitygate.wait=true

      # Seuil de couverture : lit la couverture globale (métrique « coverage » de SonarQube, lignes et branches) une fois
      # l'analyse terminée et fait échouer le job sous le minimum, ou si aucune couverture n'est remontée (rapport JaCoCo non importé).
      # Le jeton passe par l'environnement. Messages en ASCII : la console du runner Windows n'est pas en UTF-8.
      - name: Checking minimum coverage
        shell: powershell
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: futurekawa-backend-siege
          COVERAGE_MIN: ${{ inputs.coverage_min }}
        run: |
          $ErrorActionPreference = 'Stop'
          $min = [double]$env:COVERAGE_MIN
          $inv = [Globalization.CultureInfo]::InvariantCulture
          $auth = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes($env:SONAR_TOKEN + ':'))
          $uri = "http://localhost:9000/api/measures/component?component=$($env:SONAR_PROJECT_KEY)&metricKeys=coverage"
          try {
            $res = Invoke-RestMethod -Uri $uri -Headers @{ Authorization = "Basic $auth" }
          } catch {
            Write-Host "::error title=API SonarQube::Lecture de la couverture impossible ($($_.Exception.Message)). Si SONAR_TOKEN est un jeton d'analyse, utiliser un jeton utilisateur (User Token)."
            exit 1
          }
          $measure = $res.component.measures | Where-Object { $_.metric -eq 'coverage' } | Select-Object -First 1
          if (-not $measure) {
            Write-Host "::error title=Couverture absente::Aucune couverture dans SonarQube pour $($env:SONAR_PROJECT_KEY) (rapport de couverture non importe ?)"
            exit 1
          }
          $coverage = [double]::Parse($measure.value, $inv)
          $msg = "Couverture SonarQube de $($env:SONAR_PROJECT_KEY) : $($coverage.ToString('0.0', $inv)) % (minimum requis : $($min.ToString('0.#', $inv)) %)"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "### $msg"
          if ($coverage -lt $min) {
            Write-Host "::error title=Couverture insuffisante::$msg"
            exit 1
          }
          Write-Host $msg

      - name: Downloading Quality Gates report
        if: always()
        shell: cmd
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          curl -s
          -u "%SONAR_TOKEN%:"
          "http://localhost:9000/api/qualitygates/project_status?projectKey=futurekawa-backend-siege"
          -o sonar-report.json

      - name: Downloading SonarQube issues
        if: always()
        shell: cmd
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          curl -s
          -u "%SONAR_TOKEN%:"
          "http://localhost:9000/api/issues/search?projectKeys=futurekawa-backend-siege"
          -o sonar-issues.json

      - name: Uploading SonarQube reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonar-reports-${{ github.run_id }}
          path: |
            sonar-report.json
            sonar-issues.json
          retention-days: 7
