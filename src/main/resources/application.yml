spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/db_siege_mondial
    username: ${DB_USER:admin_siege}
    password: ${DB_PASSWORD:password_siege}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

app:
  country-adapters:
    mapping:
      "BRESIL":
        url: ${URL_BRESIL:http://localhost:8080/api/}
        tolerences:
          temperature-ideale: ${TEMPERATURE_IDEALE:29}
          humidite-ideale: ${HUMIDITE_IDEALE:55}
          tolerance-temperature: ${TOLERANCE_TEMPERATURE:3}
          tolerance-humidite: ${TOLERANCE_HUMIDITE:2}

      "COLOMBIE":
        url: ${URL_COLOMBIE:http://localhost:8079/api/}
        tolerences:
          temperature-ideale: ${TEMPERATURE_IDEALE:26}
          humidite-ideale: ${HUMIDITE_IDEALE:80}
          tolerance-temperature: ${TOLERANCE_TEMPERATURE:3}
          tolerance-humidite: ${TOLERANCE_HUMIDITE:2}


      "EQUATEUR":
          url: ${URL_EQUATEUR:http://localhost:8078/api/}
          tolerences:
            temperature-ideale: ${TEMPERATURE_IDEALE:31}
            humidite-ideale: ${HUMIDITE_IDEALE:60}
            tolerance-temperature: ${TOLERANCE_TEMPERATURE:3}
            tolerance-humidite: ${TOLERANCE_HUMIDITE:2}