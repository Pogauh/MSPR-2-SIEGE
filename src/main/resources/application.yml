spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/db_siege_mondial
    username: ${DB_USER:admin_siege}
    password: ${DB_PASSWORD:password_siege}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

app:
  country-adapters:
    mapping:
      "BRESIL":
        url: ${URL_BRESIL:http://localhost:8080/api/}
        tolerences:
          temperature-ideale: ${TEMPERATURE_IDEALE:29}
          humidite-ideale: ${HUMIDITE_IDEALE:55}
          tolerance-temperature: ${TOLERANCE_TEMPERATURE:3}
          tolerance-humidite: ${TOLERANCE_HUMIDITE:2}

#      "COLOMBIE": "http://localhost:8085/api/"
#      "EQUATEUR": "http://localhost:8088/api/"