spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/db_siege_mondial
    username: ${DB_USER:admin_siege}
    password: ${DB_PASSWORD:password_siege}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

app:
  country-adapters:
    mapping:
      "BRESIL": ${URL_BRESIL:http://localhost:8080/api/}
      "COLOMBIE": "http://localhost:8085/api/"
      "EQUATEUR": "http://localhost:8088/api/"

